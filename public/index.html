<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Developer Radar</title>
<style>
  :root {
    --bg: #f4f4f2; --surface: #fcfcfb; --surface-2: #ededea; --border: #d9d9d4;
    --ink: #1c1c1a; --ink-2: #4f4f4a; --ink-3: #7a7a73; --accent: #2b5fa8;
    --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
    --good-text: #006300;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #121211; --surface: #1a1a19; --surface-2: #242423; --border: #33332f; --ink: #ededea; --ink-2: #bdbdb6; --ink-3: #8a8a83; --accent: #7fa8e6; --good-text: #0ca30c; } }
  :root[data-theme="dark"] { --bg: #121211; --surface: #1a1a19; --surface-2: #242423; --border: #33332f; --ink: #ededea; --ink-2: #bdbdb6; --ink-3: #8a8a83; --accent: #7fa8e6; --good-text: #0ca30c; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; }
  header { padding: 20px 16px 8px; max-width: 1200px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--ink-3); font-size: 13px; }
  main { max-width: 1200px; margin: 0 auto; padding: 0 16px 48px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 14px 0; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; cursor: pointer; }
  .tile.active { outline: 2px solid var(--accent); }
  .tile .n { font-size: 26px; font-weight: 600; line-height: 1.1; }
  .tile .l { color: var(--ink-3); font-size: 12px; display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0 12px; }
  input[type=search], select, button { font: inherit; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; cursor: pointer; }
  button.ghost { cursor: pointer; }
  .tabs { display: flex; gap: 4px; margin-left: auto; }
  .tabs button { cursor: pointer; }
  .tabs button.on { background: var(--surface-2); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 9px 10px; border-top: 1px solid var(--border); vertical-align: top; }
  th { font-size: 12px; color: var(--ink-3); font-weight: 600; border-top: 0; background: var(--surface-2); }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--surface-2); }
  .name { font-weight: 600; }
  .muted { color: var(--ink-3); font-size: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); white-space: nowrap; }
  .bar { height: 8px; background: var(--surface-2); border-radius: 4px; width: 120px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 4px; }
  .score { display: flex; align-items: center; gap: 8px; }
  .score b { width: 28px; text-align: right; font-variant-numeric: tabular-nums; }
  .delta { font-size: 12px; color: var(--ink-3); }
  .factors { color: var(--ink-2); font-size: 12px; }
  .sev { font-size: 11px; font-weight: 700; letter-spacing: .02em; }
  /* detail drawer */
  .drawer { position: fixed; inset: 0 0 0 auto; width: min(640px, 100%); background: var(--surface); border-left: 1px solid var(--border); box-shadow: -8px 0 24px rgba(0,0,0,.15); overflow: auto; padding: 18px 20px 40px; transform: translateX(100%); transition: transform .2s; z-index: 10; }
  .drawer.open { transform: none; }
  .drawer h2 { margin: 0 0 2px; font-size: 18px; padding-right: 70px; }
  .drawer h3 { font-size: 13px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; margin: 22px 0 8px; }
  .close { position: absolute; top: 12px; right: 12px; }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; font-size: 13px; }
  .kv div span { color: var(--ink-3); display: block; font-size: 11px; }
  .factor { display: grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); }
  .factor .pts { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .factor .pts.neg { color: var(--good-text); }
  .factor .d { color: var(--ink-2); font-size: 12px; margin-top: 2px; }
  .alert { padding: 8px 0; border-top: 1px solid var(--border); display: grid; grid-template-columns: 76px 1fr; gap: 10px; }
  .alert .t { font-weight: 600; }
  .alert .d { color: var(--ink-2); font-size: 12px; }
  .alert .when { color: var(--ink-3); font-size: 11px; }
  .alert.ack { opacity: .55; }
  a { color: var(--accent); }
  .empty { padding: 30px; text-align: center; color: var(--ink-3); }
  .banner { background: var(--surface-2); border: 1px dashed var(--border); border-radius: 10px; padding: 10px 14px; margin: 10px 0; font-size: 13px; }
  svg.spark { width: 100%; height: 56px; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin: 6px 0 0; }
  @media (max-width: 720px) { .hide-sm { display: none; } .bar { width: 70px; } }
</style>
</head>
<body>
<header>
  <h1>Developer Radar</h1>
  <div class="sub" id="sub">Loading…</div>
</header>
<main>
  <div id="banner"></div>
  <div class="tiles" id="tiles"></div>
  <div class="filters">
    <input type="search" id="q" placeholder="Search developer or company number" style="min-width:260px">
    <select id="sort"><option value="score">Sort: score</option><option value="change">Sort: biggest change</option><option value="name">Sort: name</option><option value="alerts">Sort: open alerts</option></select>
    <button class="primary" id="syncBtn" title="Collect fresh data from Companies House and The Gazette">Sync now</button>
    <div class="tabs"><button class="on" data-tab="companies">Companies</button><button data-tab="alerts">Alerts</button><button data-tab="method">Method</button></div>
  </div>
  <section id="companies"></section>
  <section id="alerts" hidden></section>
  <section id="method" hidden></section>
</main>
<aside class="drawer" id="drawer"><button class="close ghost" onclick="closeDrawer()">Close</button><div id="drawerBody"></div></aside>

<script>
const BAND_COLOR = { Low: 'var(--good)', Watch: 'var(--warning)', Elevated: 'var(--serious)', Critical: 'var(--critical)' };
const BAND_ICON = { Low: '✓', Watch: '!', Elevated: '▲', Critical: '✖' };
const SEV_COLOR = { info: 'var(--ink-3)', medium: 'var(--warning)', high: 'var(--serious)', critical: 'var(--critical)' };
let state = { overview: null, alerts: [], filterBand: null, tab: 'companies' };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtDate = (s) => (s ? new Date(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '—');
const fmtWhen = (s) => (s ? new Date(s).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '');

async function load() {
  const [o, a] = await Promise.all([fetch('/api/overview').then((r) => r.json()), fetch('/api/alerts?limit=300').then((r) => r.json())]);
  state.overview = o; state.alerts = a.alerts;
  render();
}

function bandChip(band) { return `<span class="chip"><span class="dot" style="background:${BAND_COLOR[band]}"></span>${BAND_ICON[band]} ${band}</span>`; }

function render() {
  const o = state.overview;
  $('#sub').textContent = `${o.companies.length} developers watched · last sync ${o.lastSync ? fmtWhen(o.lastSync) : 'never'}` + (o.registerSize ? ` · NHQB register: ${o.registerSize} entries (refreshed ${fmtDate(o.nhqbLastRefresh)})` : '');
  $('#banner').innerHTML = o.demo ? `<div class="banner"><b>Demo mode.</b> Every company shown is fictional. Set <code>COMPANIES_HOUSE_API_KEY</code> in <code>.env</code> and run <code>npm run sync</code> then <code>npm run serve</code> for live data.</div>`
    : o.unmatched?.length ? `<div class="banner"><b>${o.unmatched.length} NHQB entr${o.unmatched.length > 1 ? 'ies' : 'y'} need a manual match</b> (ambiguous Companies House search). Run <code>radar watch list</code> to see candidates and <code>radar watch add &lt;number&gt;</code> to confirm.</div>` : '';
  $('#tiles').innerHTML = o.bands.map((b) => `<div class="tile ${state.filterBand === b.name ? 'active' : ''}" onclick="toggleBand('${b.name}')"><div class="n">${o.bandCounts[b.name] || 0}</div><div class="l"><span class="dot" style="background:${BAND_COLOR[b.name]}"></span>${BAND_ICON[b.name]} ${b.name} (${b.min}${b.name === 'Critical' ? '–100' : '–' + (o.bands[o.bands.indexOf(b) + 1].min - 1)})</div></div>`).join('')
    + `<div class="tile" onclick="setTab('alerts')"><div class="n">${state.alerts.filter((a) => !a.acknowledged && a.severity !== 'info').length}</div><div class="l">⚑ Open alerts</div></div>`;
  renderCompanies(); renderAlerts(); renderMethod();
}

function toggleBand(b) { state.filterBand = state.filterBand === b ? null : b; render(); }
function setTab(t) { state.tab = t; document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === t)); for (const s of ['companies', 'alerts', 'method']) $('#' + s).hidden = s !== t; }
document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.tab)));
$('#q').addEventListener('input', renderCompanies);
$('#sort').addEventListener('change', renderCompanies);
$('#syncBtn').addEventListener('click', async () => {
  const r = await fetch('/api/sync', { method: 'POST' }).then((r) => r.json());
  $('#syncBtn').textContent = r.error ? 'Sync unavailable' : 'Sync started…';
  if (r.error) alert(r.error); else setTimeout(() => { load(); $('#syncBtn').textContent = 'Sync now'; }, 15000);
});

function renderCompanies() {
  const q = $('#q').value.trim().toLowerCase();
  const sort = $('#sort').value;
  let rows = state.overview.companies.filter((c) => (!state.filterBand || c.band === state.filterBand) && (!q || c.name.toLowerCase().includes(q) || c.company_number.toLowerCase().includes(q)));
  const cmp = { score: (a, b) => b.score - a.score, change: (a, b) => (b.score - (b.previousScore ?? b.score)) - (a.score - (a.previousScore ?? a.score)), name: (a, b) => a.name.localeCompare(b.name), alerts: (a, b) => b.openAlerts - a.openAlerts }[sort];
  rows.sort(cmp);
  if (!rows.length) { $('#companies').innerHTML = '<div class="empty">No companies match.</div>'; return; }
  $('#companies').innerHTML = `<table><thead><tr><th>Developer</th><th>Risk score</th><th class="hide-sm">Why</th><th class="hide-sm">Accounts</th><th class="hide-sm">Charges</th><th class="hide-sm">Directors</th><th>Alerts</th></tr></thead><tbody>
    ${rows.map((c) => { const delta = c.previousScore == null ? null : c.score - c.previousScore; return `<tr onclick="openDrawer('${c.company_number}')">
      <td><div class="name">${esc(c.name)}</div><div class="muted">${c.company_number} · ${esc(c.status)}${c.nhqb ? ` · NHQB ${esc(c.nhqb.status)}` : ''}${c.matchConfidence != null && c.matchConfidence < 0.9 ? ' · match ' + Math.round(c.matchConfidence * 100) + '%' : ''}</div></td>
      <td><div class="score"><b>${c.score}</b><div class="bar"><i style="width:${c.score}%;background:${BAND_COLOR[c.band]}"></i></div>${bandChip(c.band)}</div>${delta ? `<div class="delta">${delta > 0 ? '▲ +' : '▼ '}${delta} since last sync</div>` : ''}</td>
      <td class="hide-sm factors">${c.topFactors.map(esc).join('<br>') || '<span class="muted">No risk factors</span>'}</td>
      <td class="hide-sm">${c.accountsOverdue ? '<span class="chip" style="color:var(--critical)">✖ Overdue</span>' : `<span class="muted">due ${fmtDate(c.accountsNextDue)}</span>`}${c.csOverdue ? '<div class="muted">CS overdue</div>' : ''}</td>
      <td class="hide-sm">${c.outstandingCharges} outstanding</td>
      <td class="hide-sm">${c.activeDirectors} active</td>
      <td>${c.openAlerts ? `<span class="chip">⚑ ${c.openAlerts}</span>` : '<span class="muted">—</span>'}</td></tr>`; }).join('')}
  </tbody></table>`;
}

function alertRow(a, withCompany = true) {
  return `<div class="alert ${a.acknowledged ? 'ack' : ''}"><div><div class="sev" style="color:${SEV_COLOR[a.severity]}">${a.severity.toUpperCase()}</div><div class="when">${fmtWhen(a.created_at)}</div></div>
    <div><div class="t">${withCompany ? `<a href="#" onclick="openDrawer('${a.company_number}');return false">${esc(a.company_name || a.company_number)}</a> — ` : ''}${esc(a.title)}</div>${a.detail ? `<div class="d">${esc(a.detail)}</div>` : ''}${a.evidence?.url ? `<div class="d"><a href="${esc(a.evidence.url)}" target="_blank" rel="noopener">View notice</a></div>` : ''}${!a.acknowledged ? `<div class="d"><a href="#" onclick="ack(${a.id});return false">Acknowledge</a></div>` : ''}</div></div>`;
}
function renderAlerts() {
  const list = state.alerts;
  $('#alerts').innerHTML = list.length ? `<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px 14px">${list.map((a) => alertRow(a)).join('')}</div>` : '<div class="empty">No alerts yet. Run a sync.</div>';
}
async function ack(id) { await fetch(`/api/alerts/${id}/ack`, { method: 'POST' }); load(); }

async function openDrawer(number) {
  const c = await fetch(`/api/companies/${number}`).then((r) => r.json());
  const s = c.snapshot;
  const hist = c.history || [];
  const spark = hist.length > 1 ? sparkline(hist) : '';
  $('#drawerBody').innerHTML = `
    <h2>${esc(c.name)}</h2>
    <div class="muted">${c.company_number} · ${esc(s.status)} · incorporated ${fmtDate(s.incorporatedOn)} · <a href="https://find-and-update.company-information.service.gov.uk/company/${c.company_number}" target="_blank" rel="noopener">Companies House</a> · <a href="https://www.thegazette.co.uk/all-notices/notice?text=${encodeURIComponent('"' + c.name + '"')}" target="_blank" rel="noopener">Gazette search</a></div>
    <div class="score" style="margin:14px 0 4px"><b style="font-size:28px;width:auto">${c.score}</b><div class="bar" style="width:200px;height:10px"><i style="width:${c.score}%;background:${BAND_COLOR[c.band]}"></i></div>${bandChip(c.band)}</div>
    ${spark}
    <h3>Score breakdown</h3>
    ${c.factors.length ? c.factors.map((f) => `<div class="factor"><div class="pts ${f.points < 0 ? 'neg' : ''}">${f.points > 0 ? '+' : ''}${f.points}</div><div><div>${esc(f.label)}</div><div class="d">${esc(f.detail || '')}${f.evidence?.url ? ` · <a href="${esc(f.evidence.url)}" target="_blank" rel="noopener">notice</a>` : ''}${Array.isArray(f.evidence) && f.evidence[0]?.url ? ' · ' + f.evidence.map((e) => `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.published)}</a>`).join(', ') : ''}</div></div></div>`).join('') : '<div class="muted">No risk factors fired.</div>'}
    <h3>Snapshot</h3>
    <div class="kv">
      <div><span>Accounts</span>${s.accounts?.overdue ? '<b style="color:var(--critical)">Overdue</b> — due ' : 'Next due '}${fmtDate(s.accounts?.nextDue)}<div class="muted">Last: ${fmtDate(s.accounts?.lastMadeUpTo)} (${esc(s.accounts?.lastType || '—')})</div></div>
      <div><span>Confirmation statement</span>${s.confirmationStatement?.overdue ? '<b style="color:var(--critical)">Overdue</b> — due ' : 'Next due '}${fmtDate(s.confirmationStatement?.nextDue)}</div>
      <div><span>Charges</span>${(s.charges || []).filter((x) => x.status === 'outstanding' || x.status === 'part-satisfied').length} outstanding of ${(s.charges || []).length}</div>
      <div><span>Board</span>${(s.officers || []).filter((o) => /director|member/.test(o.role) && !o.resignedOn).length} active directors</div>
      <div><span>NHQB</span>${s.nhqb ? `${esc(s.nhqb.status)} since ${fmtDate(s.nhqb.registeredOn)}${s.nhqb.deactivatedOn ? `, deactivated ${fmtDate(s.nhqb.deactivatedOn)}` : ''}` : 'not linked'}</div>
      <div><span>SIC</span>${(s.sicCodes || []).join(', ') || '—'}${s.isHousebuilder ? ' (housebuilding)' : ''}</div>
    </div>
    <h3>Charges</h3>
    ${(s.charges || []).length ? `<table><thead><tr><th>Created</th><th>Status</th><th>In favour of</th></tr></thead><tbody>${s.charges.slice().sort((a, b) => (b.createdOn || '').localeCompare(a.createdOn || '')).slice(0, 12).map((x) => `<tr><td>${fmtDate(x.createdOn)}</td><td>${esc(x.status)}${x.satisfiedOn ? ' ' + fmtDate(x.satisfiedOn) : ''}</td><td>${esc((x.personsEntitled || []).join(', ') || x.classification || '')}</td></tr>`).join('')}</tbody></table>` : '<div class="muted">None registered.</div>'}
    <h3>Officers</h3>
    <table><thead><tr><th>Name</th><th>Role</th><th>Appointed</th><th>Resigned</th></tr></thead><tbody>${(s.officers || []).slice().sort((a, b) => (b.resignedOn || '9') > (a.resignedOn || '9') ? 1 : -1).slice(0, 20).map((o) => `<tr><td>${esc(o.name)}</td><td>${esc(o.role)}</td><td>${fmtDate(o.appointedOn)}</td><td>${o.resignedOn ? `<b>${fmtDate(o.resignedOn)}</b>` : '—'}</td></tr>`).join('')}</tbody></table>
    <h3>Gazette notices (${(c.gazette || []).length})</h3>
    ${(c.gazette || []).length ? c.gazette.map((g) => `<div class="alert"><div class="when">${fmtDate(g.published)}</div><div><div class="t"><a href="${esc(g.url)}" target="_blank" rel="noopener">${esc(g.category)}</a></div><div class="d">${esc(g.snippet).slice(0, 220)}…</div></div></div>`).join('') : '<div class="muted">No corporate insolvency notices found for this name in the look-back window.</div>'}
    <h3>Alerts</h3>
    ${(c.alerts || []).length ? c.alerts.map((a) => alertRow(a, false)).join('') : '<div class="muted">None.</div>'}`;
  $('#drawer').classList.add('open');
}
function closeDrawer() { $('#drawer').classList.remove('open'); }
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });

function sparkline(hist) {
  const w = 600, h = 56, pad = 6;
  const xs = hist.map((_, i) => pad + (i * (w - 2 * pad)) / Math.max(1, hist.length - 1));
  const ys = hist.map((p) => h - pad - (p.score / 100) * (h - 2 * pad));
  const d = xs.map((x, i) => `${i ? 'L' : 'M'}${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="Score history"><line x1="${pad}" x2="${w - pad}" y1="${h - pad}" y2="${h - pad}" stroke="var(--border)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2"/>${xs.map((x, i) => `<circle cx="${x}" cy="${ys[i]}" r="4" fill="${BAND_COLOR[hist[i].band]}" stroke="var(--surface)" stroke-width="2"><title>${fmtDate(hist[i].taken_at)}: ${hist[i].score}</title></circle>`).join('')}</svg><div class="legend">Score history over ${hist.length} snapshots (${fmtDate(hist[0].taken_at)} → ${fmtDate(hist[hist.length - 1].taken_at)})</div>`;
}

function renderMethod() {
  $('#method').innerHTML = `<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;max-width:820px">
  <h2 style="font-size:16px;margin:0 0 8px">How the composite score works</h2>
  <p>Each developer's latest snapshot from Companies House, The Gazette and the NHQB register is run through an itemised rule set. Points add up to a score from 0 to 100; every point is listed on the company's breakdown so you can see exactly why it scored what it did.</p>
  <p><b>Hard stops (score pinned at 100):</b> company status is in liquidation / administration / receivership / dissolved; an insolvency case on the Companies House register; an insolvency-category filing; a Gazette notice of administrators, liquidators (creditors' voluntary), winding-up order or receivers; NHQB insolvency flag.</p>
  <table><thead><tr><th>Signal</th><th>Points</th></tr></thead><tbody>
    <tr><td>Gazette: petition to wind up (not since dismissed)</td><td>+70</td></tr>
    <tr><td>Gazette: moratorium / creditors' meeting / notice to creditors</td><td>+50 to +70</td></tr>
    <tr><td>Gazette: members' voluntary (solvent) liquidation</td><td>+40</td></tr>
    <tr><td>Strike-off: first Gazette notice (GAZ1) or DS01 application, not discontinued</td><td>+60</td></tr>
    <tr><td>Annual accounts overdue (more than 90 days late)</td><td>+25 (+35)</td></tr>
    <tr><td>Confirmation statement overdue · both overdue at once</td><td>+10 · +10</td></tr>
    <tr><td>Accounts type downgraded since last snapshot (e.g. full → micro-entity)</td><td>+10</td></tr>
    <tr><td>Latest accounts older than 21 months · accounts due within 30 days</td><td>+10 · +5</td></tr>
    <tr><td>New charge in last 90 days (each, max 30) · 3–12 months ago (each, max 12)</td><td>+10 · +4</td></tr>
    <tr><td>Five or more outstanding charges</td><td>+5</td></tr>
    <tr><td>Director resigned in last 90 days (each, max 24) · 3–6 months ago (each, max 8)</td><td>+8 · +4</td></tr>
    <tr><td>Half or more of the board (at least two) left within 12 months</td><td>+10</td></tr>
    <tr><td>Fewer than two active directors</td><td>+10</td></tr>
    <tr><td>Registered office moved in 90 days · name changed in 6 months</td><td>+5 · +5</td></tr>
    <tr><td>Incorporated under 2 years ago · 2–4 years ago</td><td>+15 · +8</td></tr>
    <tr><td>Deactivated on NHQB register</td><td>+15</td></tr>
    <tr><td>Charge satisfied in last 12 months (each, max −6) · accounts filed in last 90 days</td><td>−3 · −5</td></tr>
  </tbody></table>
  <p style="margin-top:12px"><b>Bands:</b> ✓ Low 0–14 · ! Watch 15–34 · ▲ Elevated 35–59 · ✖ Critical 60–100.</p>
  <p><b>Alerts</b> are generated by diffing consecutive snapshots: new charge, director resigned/appointed, accounts or confirmation statement went overdue (or were filed), new Gazette notice, insolvency filing, strike-off notice, status change, NHQB status change, band change. The first snapshot only raises alerts for items from the last 90 days or serious historical ones.</p>
  <p class="muted">This is a rules-based early-warning screen built on public filings, not a credit rating. Companies House data lags real events (a charge can take weeks to appear, accounts are up to 9 months old when filed), so treat Low as "nothing visible yet" rather than "safe".</p></div>`;
