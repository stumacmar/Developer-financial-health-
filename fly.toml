# Fly.io config. First time: `fly launch --no-deploy --copy-config`, then `fly volumes create radar_data --size 1`,
# set secrets (see README "Going live"), then `fly deploy`.
app = "developer-radar"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  RADAR_DB = "/data/radar.sqlite"
  SYNC_INTERVAL_HOURS = "24"

[[mounts]]
  source = "radar_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"      # the in-process scheduler needs the machine awake
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
